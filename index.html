<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>片单 · 追片工具</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f2f2f7;--panel:#ffffff;--side:#fafafc;--text:#1d1d1f;--sub:#86868b;
    --line:#e6e6eb;--accent:#0a84ff;--accent-soft:#e9f2ff;--chip:#eeeef3;
    --rowhover:#f6f6fb;--done:#b8b8be;--shadow:0 12px 36px rgba(0,0,0,.08);
    --ok:#34c759;--warn:#ff9f0a;
  }
  html[data-theme="dark"]{
    --bg:#0e0e10;--panel:#1c1c1e;--side:#141416;--text:#f2f2f7;--sub:#98989d;
    --line:#2c2c2e;--accent:#0a84ff;--accent-soft:#10243d;--chip:#2c2c2e;
    --rowhover:#242427;--done:#5c5c61;--shadow:0 12px 36px rgba(0,0,0,.55);
    --ok:#30d158;--warn:#ff9f0a;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;height:100vh;overflow:hidden;width:100%}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:252px;flex:0 0 252px;min-width:0;background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:20px 12px 12px;
  }
  .brand{font-size:20px;font-weight:700;letter-spacing:.5px;padding:0 10px 4px}
  .brand span{color:var(--accent)}
  .group-label{font-size:11px;color:var(--sub);font-weight:600;padding:16px 10px 6px;letter-spacing:.6px}
  .theme-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
  .theme-item{
    display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;
    font-size:14px;color:var(--text);user-select:none;margin-bottom:2px;
  }
  .theme-item:hover{background:var(--chip)}
  .theme-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .theme-item .tname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .theme-item .tcount{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
  .theme-item.active .tcount{color:var(--accent);opacity:.8}
  .theme-item .del{opacity:0;font-size:15px;color:var(--sub);border:0;background:none;padding:0 2px}
  .theme-item:hover .del{opacity:1}
  .side-actions{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
  .side-btn{
    display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;border:0;
    background:none;color:var(--text);font-size:13px;text-align:left;
  }
  .side-btn:hover{background:var(--chip)}
  .side-btn .ico{width:18px;text-align:center;opacity:.75}
  .storage{font-size:11px;color:var(--sub);padding:8px 10px 0;line-height:1.55;word-break:break-all}
  .storage b{color:var(--ok);font-weight:600}

  /* ---------- main ---------- */
  .main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  .head{padding:22px 28px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .head-top{display:flex;align-items:flex-start;gap:16px}
  .head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.3px}
  .head .sub{color:var(--sub);font-size:13px;margin-top:6px}
  .progress{flex:1;max-width:320px;margin-top:8px}
  .bar{height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0a84ff,#5ac8fa);transition:width .35s ease}
  .progress .ptext{font-size:12px;color:var(--sub);margin-top:6px;font-variant-numeric:tabular-nums}

  .tools{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .search{
    flex:1 1 220px;min-width:140px;position:relative
  }
  .search input{
    width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:13.5px;outline:none;
  }
  .search input:focus{border-color:var(--accent);background:var(--panel)}
  .search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45;font-size:13px}
  select,.btn{
    padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-size:13px;outline:none;
  }
  .btn:hover{background:var(--chip)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.06)}
  .chips{display:flex;background:var(--chip);border-radius:9px;padding:2px}
  .chips button{
    border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--sub);
  }
  .chips button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* ---------- 参数筛选 ---------- */
  .filters{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
  .filters:empty{display:none}
  .ms{position:relative}
  .ms-btn{
    padding:5px 11px;font-size:12.5px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);outline:none;white-space:nowrap;
  }
  .ms-btn:hover{border-color:var(--accent)}
  .ms-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .ms-btn::after{content:"▾";font-size:9px;opacity:.6;margin-left:5px}
  .ms-panel{
    position:absolute;top:calc(100% + 6px);left:0;min-width:196px;max-height:280px;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    box-shadow:var(--shadow);padding:6px;z-index:60;
  }
  .ms-opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .ms-opt:hover{background:var(--chip)}
  .ms-opt input{accent-color:var(--accent);width:14px;height:14px;margin:0;cursor:pointer}
  .ms-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ms-n{color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}
  .ms-foot{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}
  .ms-foot button{
    width:100%;border:0;background:none;color:var(--accent);font-size:12px;
    padding:6px;border-radius:7px;text-align:left;
  }
  .ms-foot button:hover{background:var(--accent-soft)}
  .filters .fcount{font-size:11.5px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
  .filters .fclear{border:0;background:none;color:var(--accent);font-size:12px;padding:4px 8px;border-radius:7px}
  .filters .fclear:hover{background:var(--accent-soft)}

  .list-wrap{flex:1 1 0;min-height:0;overflow:auto;padding:14px 28px 40px}
  .offline{
    background:#fff4e5;color:#8a5a00;font-size:12.5px;line-height:1.6;
    padding:9px 28px;border-bottom:1px solid #ffe0b2;
  }
  .offline[hidden]{display:none}
  .offline b{font-weight:700}
  html[data-theme="dark"] .offline{background:#3a2a10;color:#ffcf80;border-color:#4a3616}
  .list{list-style:none;margin:0;padding:0}

  /* ---------- rows ---------- */
  .row{
    display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:11px;
    border:1px solid transparent;cursor:pointer;transition:background .12s;
  }
  .row:hover{background:var(--panel);border-color:var(--line)}
  .check{
    flex:0 0 21px;width:21px;height:21px;border-radius:50%;border:1.7px solid var(--done);
    background:transparent;margin-top:2px;display:flex;align-items:center;justify-content:center;
    transition:all .15s;padding:0;
  }
  .row:hover .check{border-color:var(--accent)}
  .row.done .check{background:var(--accent);border-color:var(--accent)}
  .row.done .check::after{
    content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }
  .info{flex:1;min-width:0}
  .line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .title{font-size:14.5px;font-weight:500}
  .row.done .title{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
  .row.done .note,.row.done .date{opacity:.55}
  .tag{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--chip);color:var(--sub);white-space:nowrap}
  .tag.soon{background:var(--accent-soft);color:var(--accent)}
  .tag.seen{background:var(--chip);color:var(--sub)}
  .date{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  .note{font-size:12px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 「观看」按钮 + 平台菜单 */
  .rating-wrap{flex:0 0 auto;align-self:center;margin-left:4px}
  .rating{
    min-width:34px;padding:3px 6px;border-radius:7px;border:1px solid transparent;
    background:var(--chip);color:var(--sub);font-size:11px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;cursor:pointer;
  }
  .rating:hover{border-color:var(--accent);color:var(--accent)}
  .rating.unrated{background:transparent;border:1px dashed var(--line);color:var(--done);font-weight:400}
  .rating.high{background:rgba(52,199,89,.16);color:#248a3d}
  .rating.mid{background:rgba(255,159,10,.16);color:#a05a00}
  .rating.low{background:rgba(142,142,147,.18);color:#6e6e73}
  html[data-theme="dark"] .rating.high{color:#7ee787}
  html[data-theme="dark"] .rating.mid{color:#ffcf80}
  html[data-theme="dark"] .rating.low{color:#c7c7cc}
  .rating-input{
    width:54px;padding:3px 5px;border-radius:7px;border:1px solid var(--accent);
    background:var(--bg);color:var(--text);font-size:11.5px;text-align:center;outline:none;
    font-family:inherit;
  }
  .rating-input::-webkit-outer-spin-button,
  .rating-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .pin{
    flex:0 0 auto;align-self:center;margin-left:4px;
    width:24px;height:24px;padding:0;border:0;background:none;border-radius:7px;
    color:var(--sub);font-size:14px;line-height:1;opacity:.45;
    transition:opacity .15s,color .15s,background .15s;
  }
  .row:hover .pin{opacity:1}
  .pin:hover{background:var(--chip)}
  .pin.on{color:var(--warn);opacity:1}
  .row.pinned{box-shadow:inset 3px 0 0 var(--warn)}
  @media (hover:none){ .pin{opacity:.8} }

  .watch{
    flex:0 0 auto;align-self:center;margin-left:6px;
    padding:4px 9px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--sub);font-size:11px;line-height:1;white-space:nowrap;
    opacity:.5;transition:opacity .15s,color .15s,background .15s,border-color .15s;
  }
  .row:hover .watch{opacity:1}
  .watch:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);opacity:1}
  .row.done .watch{opacity:.3}
  .row.done:hover .watch{opacity:1}
  @media (hover:none){ .watch{opacity:.8} }

  .watch-menu[hidden]{display:none}
  .watch-menu{
    position:absolute;z-index:90;min-width:158px;padding:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
  }
  .wm-head{
    font-size:11px;color:var(--sub);padding:5px 9px 7px;
    max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .wm-item{
    display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;
    text-decoration:none;color:var(--text);font-size:13px;
  }
  .wm-item:hover{background:var(--chip)}
  .wm-item i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .wm-hint{margin-left:auto;font-size:10.5px;color:var(--sub);opacity:.85;white-space:nowrap}
  .wm-item.custom:hover .wm-hint{color:var(--accent);opacity:1}
  .wm-empty{padding:8px 9px;font-size:12px;color:var(--sub);line-height:1.6}

  .api-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .api-name{flex:0 0 54px;font-size:12.5px;font-weight:600;color:var(--text)}
  .api-row input{
    flex:1;min-width:0;padding:7px 10px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit;outline:none;
  }
  .api-row input:focus{border-color:var(--accent)}
  .api-row a{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
  .api-row a:hover{text-decoration:underline}
  .api-note{margin:0 0 10px 64px}

  .plat-picker{display:flex;flex-wrap:wrap;gap:8px}
  .plat-opt{
    display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);font-size:12.5px;cursor:pointer;
  }
  .plat-opt:hover{border-color:var(--accent)}
  .plat-opt input{accent-color:var(--accent);width:14px;height:14px;margin:0;cursor:pointer}
  .plat-opt i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .plat-edit{
    border:0;background:none;color:var(--sub);font-size:12px;line-height:1;
    padding:0 2px;margin-left:2px;cursor:pointer;
  }
  .plat-edit:hover{color:var(--accent)}
  .plat-del{
    border:0;background:none;color:var(--sub);font-size:15px;line-height:1;
    padding:0 1px;margin-left:2px;cursor:pointer;
  }
  .plat-del:hover{color:#ff3b30}
  .plat-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .plat-add input{
    flex:1 1 150px;min-width:0;padding:7px 10px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);
    font-size:12.5px;font-family:inherit;outline:none;
  }
  .plat-add input:focus{border-color:var(--accent)}
  .plat-add input::placeholder{color:var(--sub)}
  .plat-err{min-height:15px;margin-top:6px;font-size:11.5px;color:var(--ok)}
  .plat-err.bad{color:#ff3b30}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);
    background:rgba(28,28,30,.94);color:#fff;font-size:13px;line-height:1.5;
    padding:9px 16px;border-radius:10px;max-width:80vw;
    opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:120;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  html[data-theme="dark"] .toast{background:rgba(245,245,247,.95);color:#1d1d1f}

  .empty{color:var(--sub);text-align:center;padding:60px 20px;font-size:14px;line-height:1.9}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .overlay[hidden]{display:none}
  .modal{
    background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:620px;
    max-height:82vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0;font-size:17px;font-weight:700}
  .modal-head .x{margin-left:auto;border:0;background:none;font-size:20px;color:var(--sub);line-height:1}
  .modal-body{padding:16px 20px 20px;overflow-y:auto}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:600}
  .field input,.field textarea{
    width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:13.5px;font-family:inherit;outline:none;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{min-height:74px;resize:vertical}
  .name-row{display:flex;gap:8px}
  .name-row input{flex:1;min-width:0}
  .name-row .btn{white-space:nowrap}
  .divider{
    display:flex;align-items:center;gap:10px;margin:18px 0 14px;
    font-size:11.5px;color:var(--sub);letter-spacing:.5px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .hint{font-size:11.5px;color:var(--sub);line-height:1.65;margin-top:8px}
  .result{max-height:46vh;overflow-y:auto;margin-top:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 0}
  .result h4{font-size:11px;color:var(--sub);margin:14px 0 6px;letter-spacing:.5px;font-weight:700}
  .hit{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px}
  .hit:hover{background:var(--chip)}
  .hit .hi{flex:1;min-width:0}
  .hit .ht{font-size:13.5px}
  .hit .hs{font-size:11.5px;color:var(--sub);margin-top:2px}
  .hit button{padding:5px 10px;font-size:12px;border-radius:8px}
  .log{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7;white-space:pre-wrap}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--sub)}

  /* ---------- 搜索框的系列片联想 ---------- */
  .suggest{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:70;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    box-shadow:var(--shadow);padding:6px;max-height:330px;overflow-y:auto;
  }
  .suggest[hidden]{display:none}
  .sug-head{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.6px;padding:6px 9px 4px}
  .sug-row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;cursor:pointer}
  .sug-row:hover,.sug-row.active{background:var(--chip)}
  .sug-name{font-size:13.5px;white-space:nowrap}
  .sug-meta{font-size:11.5px;color:var(--sub);white-space:nowrap}
  .sug-state{margin-left:auto;font-size:11px;color:var(--sub);white-space:nowrap}
  .sug-state.add{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">片单<span>·</span></div>
    <div class="group-label">我的片单</div>
    <ul class="theme-list" id="themeList"></ul>
    <div class="side-actions">
      <button class="side-btn" id="btnAddTheme"><span class="ico">＋</span>新建片单</button>
      <button class="side-btn" id="btnSettings"><span class="ico">⚙</span>设置与备份</button>
      <div class="storage" id="storageInfo">数据：读取中…</div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div class="head-top">
        <div>
          <h1 id="themeTitle">—</h1>
          <div class="sub" id="themeSub"></div>
        </div>
        <div class="progress">
          <div class="bar"><i id="barFill" style="width:0%"></i></div>
          <div class="ptext" id="progressText">0 / 0</div>
        </div>
      </div>
      <div class="tools">
        <div class="search">
          <span class="mag">⌕</span>
          <input id="q" type="search" placeholder="搜索片名、备注、出品；输入系列名可直接切换（如 007）" autocomplete="off">
          <div class="suggest" id="suggest" hidden></div>
        </div>
        <select id="sort">
          <option value="date-asc">上映时间 · 早→晚</option>
          <option value="date-desc">上映时间 · 晚→早</option>
          <option value="title">片名</option>
          <option value="unseen">未看优先</option>
        </select>
        <div class="chips" id="chips">
          <button data-f="all" class="on">全部</button>
          <button data-f="unseen">未看</button>
          <button data-f="seen">已看</button>
        </div>
        <button class="btn primary" id="btnUpdate">更新</button>
      </div>
      <div class="filters" id="filters"></div>
    </header>

    <div class="offline" id="offlineBanner" hidden>
      没连上本地服务：现在点「已看」只存在浏览器里，<b>不会写进 data/</b>。
      双击「启动片单.bat」后刷新页面即可恢复。
    </div>

    <div class="list-wrap">
      <ul class="list" id="list"></ul>
    </div>
  </main>

function normalize(s) {
  const base = Object.assign(structuredClone(DEFAULT_STATE), s || {});
  base.settings = Object.assign({}, DEFAULT_STATE.settings, (s && s.settings) || {});
  const rawCustom = Array.isArray(base.settings.customPlatforms) ? base.settings.customPlatforms : [];
  base.settings.customPlatforms = rawCustom.filter((c) =>
    c && typeof c.id === "string" && typeof c.name === "string" && typeof c.url === "string"
    && /^https?:\/\/\S+$/i.test(c.url));
  const ids = PLATFORMS.map((p) => p.id).concat(base.settings.customPlatforms.map((c) => c.id));
  if (!Array.isArray(base.settings.platforms)) {
    base.settings.platforms = ids.slice();
  } else {
    base.settings.platforms = base.settings.platforms.filter((x) => ids.indexOf(x) >= 0);
  }
  base.watched = base.watched || {};
  base.pinned = base.pinned || {};
base.ratings = (base.ratings && typeof base.ratings === "object") ? base.ratings : {};
  const keys = base.settings.apiKeys || {};
  base.settings.apiKeys = {
    tmdb: typeof keys.tmdb === "string" ? keys.tmdb : "",
    omdb: typeof keys.omdb === "string" ? keys.omdb : "",
  };
  // 兼容旧版单独存的 tmdbKey
  if (!base.settings.apiKeys.tmdb && base.settings.tmdbKey) {
    base.settings.apiKeys.tmdb = base.settings.tmdbKey;
  }
  base.extra = base.extra || {};

  const ui = Object.assign({}, DEFAULT_STATE.ui, (s && s.ui) || {});
  const f = Object.assign({}, DEFAULT_STATE.ui.filters, ui.filters || {});
  ["v", "s", "dec", "rel"].forEach((k) => {
    if (!Array.isArray(f[k])) f[k] = [];
  });
  // 每个片单各自的筛选要原样带过来，否则刷新后就丢了
  const themeUi = (ui.themeUi && typeof ui.themeUi === "object") ? ui.themeUi : {};
  base.ui = {
    filters: f,
    themeUi: themeUi,
    sort: typeof ui.sort === "string" && ui.sort ? ui.sort : "date-asc",
    chip: ["all", "unseen", "seen"].indexOf(ui.chip) >= 0 ? ui.chip : "all",
  };

  if (!Array.isArray(base.themes) || !base.themes.length) {
    base.themes = structuredClone(DEFAULT_STATE.themes);
  }
  if (!base.themes.some((t) => t.id === base.cur)) base.cur = base.themes[0].id;
  return base;
}

function readLocal() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

async function bootState() {
  try {
    const r = await fetch(API + "/api/state", { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j && j.ok) {
        storageMode = "disk";
        if (j.state && j.state.themes) {
          state = normalize(j.state);
        } else {
          // data/ 里还没有数据：把浏览器里的旧数据迁过去
          state = normalize(readLocal() || structuredClone(DEFAULT_STATE));
          await saveState(true);
        }
        return;
      }
    }
  } catch (e) {
    /* 服务没启动，走浏览器存储 */
  }
  storageMode = "local";
  state = normalize(readLocal() || structuredClone(DEFAULT_STATE));
}

/* 把当前界面选择写进 state，随数据一起存盘。
   筛选与「已看/未看」按片单分开存，切换片单互不影响；排序是全局偏好。 */
let uiReady = false;

function currentChip() {
  const el = document.querySelector("#chips button.on");
  return el ? el.dataset.f : "all";
}

function saveUiFor(themeId) {
  if (!themeId) return;
  if (!state.ui.themeUi) state.ui.themeUi = {};
  state.ui.themeUi[themeId] = {
    filters: {
      v: [...filters.v],
      s: [...filters.s],
      dec: [...filters.dec],
      rel: [...filters.rel],
    },
    chip: currentChip(),
  };
}

function syncUiToState() {
  if (!uiReady) return;            // 界面还没还原完，别拿默认值覆盖存档
  const sortEl = $("#sort");
  if (sortEl) state.ui.sort = sortEl.value;
  saveUiFor(state.cur);
}

function saveState(immediate) {
  syncUiToState();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 忽略 */ }
  if (storageMode !== "disk") return Promise.resolve();

  const push = () => fetch(API + "/api/state", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(state, null, 2),
  }).catch((e) => console.warn("写入 data/state.json 失败", e));

  clearTimeout(saveTimer);
  if (immediate) return push();
  saveTimer = setTimeout(push, 300);
  return Promise.resolve();
}

function save() { saveState(false); }

/* 关页面时把还没写出去的改动补写一次，避免防抖窗口内丢数据 */
window.addEventListener("pagehide", () => {
  if (storageMode !== "disk") return;
  try {
    fetch(API + "/api/state", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state, null, 2),
      keepalive: true,
    });
  } catch (e) { /* 忽略 */ }
});

/* ============================================================ helpers */
const $ = (sel) => document.querySelector(sel);
const keyOf = (it) => it.t + "|" + (it.d || "");
const wkey = (themeId, it) => themeId + "::" + keyOf(it);
const isWatched = (themeId, it) => !!state.watched[wkey(themeId, it)];

/* 固定显示：不受筛选与「已看/未看」影响，但排序不变 */
const isPinned = (themeId, it) => !!(state.pinned && state.pinned[wkey(themeId, it)]);

/* ---------- 评分 ---------- */
const RATING_PLATFORMS = [
  { id: "douban", name: "豆瓣" },
  { id: "imdb", name: "IMDb" },
  { id: "tmdb", name: "TMDB" },
];

function ratingPlatform() {
  const id = state.settings.ratingPlatform || "douban";
  if (id === "off") return null;
  return RATING_PLATFORMS.filter((p) => p.id === id)[0] || RATING_PLATFORMS[0];
}

/* ---------- 公开 API 密钥 ---------- */
const API_PROVIDERS = [
  {
    key: "tmdb", name: "TMDB",
    hint: "themoviedb.org → 设置 → API → 申请免费 Key；用于「更新」同步和 TMDB 评分",
    url: "https://www.themoviedb.org/settings/api",
  },
  {
    key: "omdb", name: "OMDb",
    hint: "omdbapi.com/apikey.aspx 免费申请；用于拉取 IMDb 评分",
    url: "https://www.omdbapi.com/apikey.aspx",
  },
];

function apiKey(name) {
  const k = state.settings.apiKeys || {};
  return (k[name] || "").trim();
}

function setApiKey(name, value) {
  if (!state.settings.apiKeys) state.settings.apiKeys = { tmdb: "", omdb: "" };
  state.settings.apiKeys[name] = value;
  save();
}


function ratingOf(themeId, it) {
  const p = ratingPlatform();
  if (!p) return null;
  const rec = state.ratings && state.ratings[wkey(themeId, it)];
  const v = rec ? rec[p.id] : null;
  return (typeof v === "number" && v > 0) ? v : null;
}

function setRating(themeId, it, value) {
  const p = ratingPlatform();
  if (!p) return;
  if (!state.ratings) state.ratings = {};
  const k = wkey(themeId, it);
  const rec = Object.assign({}, state.ratings[k] || {});
  if (value == null || isNaN(value)) delete rec[p.id];
  else rec[p.id] = Math.max(0, Math.min(10, Math.round(value * 10) / 10));
  if (Object.keys(rec).length) state.ratings[k] = rec;
  else delete state.ratings[k];
  save();
  renderList();
}
/* ---------- 从公开 API 拉取评分 ---------- */
async function fetchRatingFor(it, platformId) {
  const year = (it.d || "").slice(0, 4);

  if (platformId === "tmdb") {
    const key = apiKey("tmdb");
    const u = "https://api.themoviedb.org/3/search/movie?api_key=" + encodeURIComponent(key)
      + "&language=zh-CN&query=" + encodeURIComponent(it.t) + (year ? "&year=" + year : "");
    const r = await fetch(u);
    if (!r.ok) throw new Error("TMDB HTTP " + r.status);
    const j = await r.json();
    const hit = (j.results || [])[0];
    if (!hit || !hit.vote_average) return null;
    return Math.round(hit.vote_average * 10) / 10;
  }

  if (platformId === "imdb") {
    const key = apiKey("omdb");
    const u = "https://www.omdbapi.com/?apikey=" + encodeURIComponent(key)
      + "&t=" + encodeURIComponent(it.t) + (year ? "&y=" + year : "");
    const r = await fetch(u);
    if (!r.ok) throw new Error("OMDb HTTP " + r.status);
    const j = await r.json();
    if (j.Response !== "True" || !j.imdbRating || j.imdbRating === "N/A") return null;
    const v = parseFloat(j.imdbRating);
    return isNaN(v) ? null : v;
  }

  return null;
}

async function fetchRatingsForTheme(onProgress) {
  const p = ratingPlatform();
  if (!p) throw new Error("评分平台已关闭，先在设置里选一个。");
  if (p.id === "douban") throw new Error("豆瓣没有公开接口，只能手动填写。想自动拉取请切到 IMDb 或 TMDB。");

  const keyName = p.id === "imdb" ? "omdb" : "tmdb";
  if (!apiKey(keyName)) throw new Error("请先在设置里填写 " + (p.id === "imdb" ? "OMDb" : "TMDB") + " API Key。");

  const todo = itemsOf(state.cur).filter((it) => ratingOf(state.cur, it) == null);
  let ok = 0, miss = 0, fail = 0;

  if (!state.ratings) state.ratings = {};
  for (let i = 0; i < todo.length; i++) {
    const it = todo[i];
    if (onProgress) onProgress(i + 1, todo.length, ok, miss, fail);
    try {
      const v = await fetchRatingFor(it, p.id);
      if (v == null) { miss++; }
      else {
        const k = wkey(state.cur, it);
        const rec = Object.assign({}, state.ratings[k] || {});
        rec[p.id] = v;
        state.ratings[k] = rec;
        ok++;
      }
    } catch (e) { fail++; }
    await new Promise((r) => setTimeout(r, 200));   // 轻微限速，避免被限流

    if (fail >= 5 && ok === 0) {
      throw new Error("连续失败 " + fail + " 次，已停止。请检查 API Key 或网络连接。");
    }
  }

  save();
  renderList();
  return { ok: ok, miss: miss, fail: fail, total: todo.length };
}

function togglePin(themeId, it) {
  if (!state.pinned) state.pinned = {};
  const k = wkey(themeId, it);
  if (state.pinned[k]) delete state.pinned[k];
  else state.pinned[k] = 1;
  save();
  renderAll();
}

const todayISO = () => new Date().toISOString().slice(0, 10);
function fmt(it) {
  if (it.ds) return it.ds;
  if (!it.d) return "未定档";
  const [y, m, d] = it.d.split("-");
  return y + "年" + Number(m) + "月" + Number(d) + "日";
}

    url: () => c.url,          // 自定义平台直接开首页，片名另走剪贴板
  })));

}

/* 复制到剪贴板：优先 Clipboard API，file:// 等环境退回 execCommand */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 落到下面的兜底 */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

/* 底部轻提示 */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* 搜索词：片名 + 年份，区分同名不同版本 */
function watchQuery(it) {
  const year = /^\d{4}/.test(it.d || "") ? it.d.slice(0, 4) : "";
  return year ? it.t + " " + year : it.t;
}

function themeName(id) {
  const th = state.themes.find((t) => t.id === id);
  if (th && th.name) return th.name;
  return CATALOG[id]?.name || "未命名片单";
}
function itemsOf(id) {
  const base = CATALOG[id]?.items || [];
  const extra = state.extra[id] || [];
  const seen = new Set(base.map(keyOf));
  return base.concat(extra.filter((x) => !seen.has(keyOf(x))));
}
function watchedCount(id) {
  return itemsOf(id).filter((it) => isWatched(id, it)).length;
}

/* ============================================================ render */
function renderThemes() {
  const ul = $("#themeList");
  ul.textContent = "";
  state.themes.forEach((th) => {
    const li = document.createElement("li");
    li.className = "theme-item" + (th.id === state.cur ? " active" : "");
    const nm = document.createElement("span");
    nm.className = "tname";
    nm.textContent = themeName(th.id);
    const ct = document.createElement("span");
    ct.className = "tcount";
    ct.textContent = watchedCount(th.id) + "/" + itemsOf(th.id).length;
    li.append(nm, ct);

    if (state.themes.length > 1) {
      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "从我的片单移除";
      del.onclick = (e) => {
        e.stopPropagation();
        if (!confirm("从我的片单里移除「" + themeName(th.id) + "」？\n（已看记录会一起删除）")) return;
        state.themes = state.themes.filter((x) => x.id !== th.id);
        delete state.extra[th.id];
        Object.keys(state.watched).forEach((k) => {
          if (k.startsWith(th.id + "::")) delete state.watched[k];
        });
        if (state.cur === th.id) state.cur = state.themes[0].id;
        save(); renderAll();
      };
      li.append(del);
    }

li.onclick = () => {
      if (th.id === state.cur) return;
      saveUiFor(state.cur);          // 记住当前片单的筛选
      state.cur = th.id;
      applyUiState();                // 载入目标片单自己的筛选
      save();
      renderAll();
    };
    li.oncontextmenu = (e) => { e.preventDefault(); openRename(th.id); };
    ul.append(li);
  });
}

/* ---------- 参数筛选：多选，按当前片单里真实存在的字段生成 ---------- */
let filters = { v: [], s: [], dec: [], rel: [] };
let openMsKey = null;   // 当前展开的下拉

const FILTER_FIELDS = [
  { key: "v", label: "版本", of: (it) => it.v || "" },
  { key: "s", label: "出品", of: (it) => it.s || "" },
  { key: "dec", label: "年代", of: (it) => decadeOf(it) },
  { key: "rel", label: "上映", of: (it) => releaseState(it) },
];

function decadeOf(it) {
  const y = parseInt((it.d || "").slice(0, 4), 10);
  return y ? Math.floor(y / 10) * 10 + "s" : "";
}

function releaseState(it) {
  if (!it.d) return "unknown";
  return it.d > todayISO() ? "soon" : "out";
}

function filterLabel(key, value) {
  if (key === "rel") return { out: "已上映", soon: "未上映", unknown: "未定档" }[value] || value;
  if (value === "") return "未标注";
  return value;
}

function clearFilters() {
  filters = { v: [], s: [], dec: [], rel: [] };
  openMsKey = null;
}

/* 把上次存下来的筛选 / 排序 / 已看筛选还原到界面上 */
function applyUiState() {
  const ui = state.ui || DEFAULT_STATE.ui;
  const perTheme = (ui.themeUi && ui.themeUi[state.cur]) || null;
  // 没有记录过的片单从「无筛选」开始，不继承别的片单
  const f = (perTheme && perTheme.filters) || {};
  filters = {
    v: [...(f.v || [])],
    s: [...(f.s || [])],
    dec: [...(f.dec || [])],
    rel: [...(f.rel || [])],
  };
  const sortEl = $("#sort");
  if (sortEl) sortEl.value = ui.sort || "date-asc";
  const chip = (perTheme && perTheme.chip) || "all";
  document.querySelectorAll("#chips button").forEach((b) => {
    b.classList.toggle("on", b.dataset.f === chip);
  });
  uiReady = true;
}

function activeFilterCount() {
  return FILTER_FIELDS.reduce((n, f) => n + (filters[f.key] ? filters[f.key].length : 0), 0);
}

function closeMsPanels() {
  document.querySelectorAll(".ms-panel").forEach((p) => p.remove());
  openMsKey = null;
}

function buildFilters() {
  const box = $("#filters");
  box.textContent = "";
  closeMsPanels();

  const all = itemsOf(state.cur);

  FILTER_FIELDS.forEach((f) => {
    const counts = new Map();
    all.forEach((it) => {
      const k = f.of(it);
      counts.set(k, (counts.get(k) || 0) + 1);
    });

    // 丢掉已经不存在的选中值；只有一种取值的字段没有筛选意义
    filters[f.key] = (filters[f.key] || []).filter((k) => counts.has(k));
    if (counts.size < 2) {
      filters[f.key] = [];
      return;
    }

    const wrap = document.createElement("div");
    wrap.className = "ms";

    const btn = document.createElement("button");
    btn.className = "ms-btn";
    const renderBtn = () => {
      const sel = filters[f.key];
      if (!sel.length) {
        btn.textContent = f.label + "：全部";
        btn.classList.remove("active");
      } else if (sel.length === 1) {
        btn.textContent = f.label + "：" + filterLabel(f.key, sel[0]);
        btn.classList.add("active");
      } else {
        btn.textContent = f.label + "：" + filterLabel(f.key, sel[0]) + " +" + (sel.length - 1);
        btn.classList.add("active");
      }
    };
    renderBtn();

    btn.onclick = (e) => {
      e.stopPropagation();
      if (openMsKey === f.key) { closeMsPanels(); return; }
      closeMsPanels();
      openMsKey = f.key;
      wrap.append(buildPanel(f, counts, renderBtn));
      btn.classList.add("open");
    };

    wrap.append(btn);
    box.append(wrap);
  });

  if (activeFilterCount() > 0) {
    const clr = document.createElement("button");
    clr.className = "fclear";
    clr.textContent = "清除筛选";
    clr.onclick = () => {
      clearFilters();
      save();
      renderAll();
    };
    box.append(clr);
  }

  const cnt = document.createElement("span");
  cnt.className = "fcount";
  cnt.id = "filterCount";
  box.append(cnt);
}

function buildPanel(f, counts, renderBtn) {
  const panel = document.createElement("div");
  panel.className = "ms-panel";

  [...counts.entries()]
    .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])))
    .forEach(([k, n]) => {
      const row = document.createElement("label");
      row.className = "ms-opt";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = filters[f.key].includes(k);
      const text = document.createElement("span");
      text.className = "ms-txt";
      text.textContent = filterLabel(f.key, k);
      const num = document.createElement("span");
      num.className = "ms-n";
      num.textContent = n;
      row.append(cb, text, num);

      cb.onchange = () => {
        if (cb.checked) filters[f.key].push(k);
        else filters[f.key] = filters[f.key].filter((x) => x !== k);
        renderBtn();
        renderList();
        updateClearButton();
        save();
      };
      panel.append(row);
    });

  const foot = document.createElement("div");
  foot.className = "ms-foot";
  const clearOne = document.createElement("button");
  clearOne.textContent = "清空此项";
  clearOne.onclick = (e) => {
    e.stopPropagation();
    filters[f.key] = [];
    panel.querySelectorAll("input[type=checkbox]").forEach((c) => { c.checked = false; });
    renderBtn();
    renderList();
    updateClearButton();
    save();
  };
  foot.append(clearOne);
  panel.append(foot);

  return panel;
}

/* 选中项变化后，主筛选行的「清除筛选」按钮要跟着出现/消失 */
function updateClearButton() {
  const box = $("#filters");
  const existing = box.querySelector(".fclear");
  if (activeFilterCount() > 0 && !existing) {
    const clr = document.createElement("button");
    clr.className = "fclear";
    clr.textContent = "清除筛选";
    clr.onclick = () => { clearFilters(); save(); renderAll(); };
    box.insertBefore(clr, box.querySelector(".fcount"));
  } else if (activeFilterCount() === 0 && existing) {
    existing.remove();
  }
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".ms")) closeMsPanels();

/* ---------- 搜索框：识别系列片 / 一键切换 ---------- */
let sugList = [];
let sugIndex = -1;

function hideSuggest() {
  const el = $("#suggest");
  if (!el || el.hidden) return;
  el.hidden = true;
  el.textContent = "";
  sugList = [];
  sugIndex = -1;
}

function switchSeries(id) {
  if (!state.themes.some((t) => t.id === id)) state.themes.push({ id });
  if (id !== state.cur) {
    saveUiFor(state.cur);
    state.cur = id;
    applyUiState();
  }
  const q = $("#q");
  if (q) q.value = "";
  hideSuggest();
  save();
  renderAll();
}

function renderSuggest() {
  const el = $("#suggest");
  if (!el) return;
  const q = $("#q").value.trim().toLowerCase();
  if (!q) return hideSuggest();

  // 只提示「别的」系列：当前片单已经显示在下面了
  const matches = Object.entries(CATALOG)
    .filter(([id]) => id !== state.cur)
    .map(([id, s]) => ({
      id,
      s,
      nameHit: s.name.toLowerCase().includes(q),
      itemHits: s.items.filter((it) => it.t.toLowerCase().includes(q)).length,
    }))
    .filter((x) => x.nameHit || x.itemHits)
    .sort((a, b) => (b.nameHit - a.nameHit) || (b.itemHits - a.itemHits)
      || a.s.name.localeCompare(b.s.name, "zh"))
    .slice(0, 6);

  if (!matches.length) return hideSuggest();

  sugList = matches;
  sugIndex = -1;
  el.textContent = "";

  const head = document.createElement("div");
  head.className = "sug-head";
  head.textContent = "切换到系列片";
  el.append(head);

  matches.forEach((m, i) => {
    const added = state.themes.some((t) => t.id === m.id);
    const row = document.createElement("div");
    row.className = "sug-row";
    row.dataset.idx = i;

    const nm = document.createElement("div");
    nm.className = "sug-name";
    nm.textContent = m.s.name;
    const meta = document.createElement("div");
    meta.className = "sug-meta";
    meta.textContent = m.s.items.length + " 部" + (m.itemHits ? " · 命中 " + m.itemHits + " 部" : "");
    const st = document.createElement("span");
    st.className = "sug-state" + (added ? "" : " add");
    st.textContent = added ? "切换" : "添加并切换";
    row.append(nm, meta, st);

    row.onmousedown = (e) => { e.preventDefault(); switchSeries(m.id); };
    el.append(row);
  });

  el.hidden = false;
}

function moveSug(step) {
  const rows = [...document.querySelectorAll("#suggest .sug-row")];
  if (!rows.length) return;
  sugIndex = (sugIndex + step + rows.length) % rows.length;
  rows.forEach((r, i) => r.classList.toggle("active", i === sugIndex));
  rows[sugIndex].scrollIntoView({ block: "nearest" });
}

function currentItems() {
  const q = $("#q").value.trim().toLowerCase();
  const f = document.querySelector("#chips button.on").dataset.f;
  let list = itemsOf(state.cur);

  // 搜索照样生效
  if (q) {
    list = list.filter((it) =>
      (it.t + " " + (it.n || "") + " " + (it.s || "") + " " + (it.v || "")).toLowerCase().includes(q)
    );
  }

  // 置顶项不受「已看/未看」和参数筛选影响，始终显示
  const keep = (it) => isPinned(state.cur, it);

  if (f === "seen") list = list.filter((it) => keep(it) || isWatched(state.cur, it));
  if (f === "unseen") list = list.filter((it) => keep(it) || !isWatched(state.cur, it));

  FILTER_FIELDS.forEach((fd) => {
    const want = filters[fd.key];
    if (want && want.length) list = list.filter((it) => keep(it) || want.indexOf(fd.of(it)) !== -1);
  });

  const mode = $("#sort").value;
  const dOf = (it) => it.d || "9999-99-99";
  if (mode === "date-asc") list.sort((a, b) => dOf(a).localeCompare(dOf(b)));
  else if (mode === "date-desc") list.sort((a, b) => dOf(b).localeCompare(dOf(a)));
  else if (mode === "title") list.sort((a, b) => a.t.localeCompare(b.t, "zh"));
  else if (mode === "unseen") {
    list.sort((a, b) => (isWatched(state.cur, a) - isWatched(state.cur, b)) || dOf(a).localeCompare(dOf(b)));
  }

  // 固定的条目只是无视筛选，排序仍按所选方式，不提前
  return list;
}

function renderHead() {
  const all = itemsOf(state.cur);
  const seen = all.filter((it) => isWatched(state.cur, it)).length;
  $("#themeTitle").textContent = themeName(state.cur);
  $("#themeSub").textContent =
    all.length + " 部 · 已看 " + seen + " · 未看 " + (all.length - seen);
  const pct = all.length ? Math.round((seen / all.length) * 100) : 0;
  $("#barFill").style.width = pct + "%";
  $("#progressText").textContent = "进度 " + pct + "%（" + seen + " / " + all.length + "）";
}

function renderList() {
  const ul = $("#list");
  ul.textContent = "";
  const list = currentItems();

  const total = itemsOf(state.cur).length;
  const cnt = $("#filterCount");
  if (cnt) {
    cnt.textContent = list.length === total
      ? "共 " + total + " 部"
      : "筛选出 " + list.length + " / " + total + " 部";
  }

  if (!list.length) {
    const div = document.createElement("div");
    div.className = "empty";
    div.textContent = itemsOf(state.cur).length
      ? "没有符合条件的条目。"
      : "这个片单还是空的：用「新建片单」添加系列片，或搜索单片加进来。";
    ul.append(div);
    return;
  }

  const today = todayISO();
  const frag = document.createDocumentFragment();

  list.forEach((it) => {
    const done = isWatched(state.cur, it);
    const li = document.createElement("li");
    li.className = "row" + (done ? " done" : "");
    li.title = done ? "点击取消「已看」" : "点击标记「已看」";

    const chk = document.createElement("button");
    chk.className = "check";
    chk.setAttribute("aria-label", done ? "取消已看" : "标记已看");

    const info = document.createElement("div");
    info.className = "info";

    const line = document.createElement("div");
    line.className = "line1";

    const title = document.createElement("span");
    title.className = "title";
    title.textContent = it.t;
    line.append(title);

    if (it.v) {
      const t = document.createElement("span");
      t.className = "tag";
      t.textContent = it.v;
      line.append(t);
    }
    if (it.s && it.s !== it.v) {
      const t = document.createElement("span");
      t.className = "tag";
      t.textContent = it.s;
      line.append(t);
    }
    if (!done && it.d && it.d > today) {
      const t = document.createElement("span");
      t.className = "tag soon";
      t.textContent = "未上映";
      line.append(t);
    }

    const date = document.createElement("span");
    date.className = "date";
    date.textContent = fmt(it);
    line.append(date);
    info.append(line);

    if (it.n && it.n !== it.s && it.n !== it.v) {
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = it.n;
      info.append(n);
    }

    const pinned = isPinned(state.cur, it);
    if (pinned) li.classList.add("pinned");

    /* 评分徽章（点一下就地改） */
    const rp = ratingPlatform();
    let ratingWrap = null;
    if (rp) {
      const score = ratingOf(state.cur, it);
      ratingWrap = document.createElement("span");
      ratingWrap.className = "rating-wrap";

      const badge = document.createElement("button");
      let cls = "rating";
      if (score == null) cls += " unrated";
      else if (score >= 8) cls += " high";
      else if (score >= 7) cls += " mid";
      else cls += " low";
      badge.className = cls;
      badge.textContent = score == null ? "—" : score.toFixed(1);
      badge.title = score == null
        ? "点此填写" + rp.name + "评分"
        : rp.name + " 评分，点此修改";
      badge.onclick = (e) => {
        e.stopPropagation();
        const inp = document.createElement("input");
        inp.className = "rating-input";
        inp.type = "number";
        inp.min = "0"; inp.max = "10"; inp.step = "0.1";
        inp.value = score == null ? "" : String(score);
        ratingWrap.textContent = "";
        ratingWrap.append(inp);
        inp.focus();
        inp.select();
        let done = false;
        const commit = () => {
          if (done) return;
          done = true;
          const v = parseFloat(inp.value);
          setRating(state.cur, it, isNaN(v) ? null : v);
        };
        inp.onblur = commit;
        inp.onkeydown = (ev) => {
          ev.stopPropagation();
          if (ev.key === "Enter") { ev.preventDefault(); commit(); }
          else if (ev.key === "Escape") { done = true; renderList(); }
        };
      };
      ratingWrap.append(badge);
      li.append(chk, info, ratingWrap);
    } else {
      li.append(chk, info);
    }
    const pin = document.createElement("button");
    pin.className = "pin" + (pinned ? " on" : "");
    pin.textContent = pinned ? "★" : "☆";
    pin.title = pinned ? "取消固定" : "固定显示（无视筛选，但不改变排序）";
    pin.setAttribute("aria-label", pinned ? "取消固定" : "固定显示");
    pin.onclick = (e) => { e.stopPropagation(); togglePin(state.cur, it); };

    li.append(pin);
    if (enabledPlatforms().length) {
      const watch = document.createElement("button");
      watch.className = "watch";
      watch.textContent = "观看";
      watch.title = "在视频平台搜索《" + it.t + "》";
      watch.onclick = (e) => { e.stopPropagation(); openWatchMenu(watch, it); };
      li.append(watch);
    }
    li.onclick = () => {
      const k = wkey(state.cur, it);
      if (state.watched[k]) delete state.watched[k];
      else state.watched[k] = Date.now();
      save(); renderAll();
    };
    frag.append(li);
  });

  ul.append(frag);
}

/* ---------- 「观看」平台菜单 ---------- */
/* 容器一开始就在页面里，只切换显隐：动态新建的浮层在某些渲染路径下不会被绘制 */
function watchMenuEl() { return document.getElementById("watchMenu"); }

function closeWatchMenu() {
  const m = watchMenuEl();
  if (!m || m.hidden) return;
  m.hidden = true;
  m.textContent = "";
  delete m.dataset.for;
}

function openWatchMenu(anchor, it) {
  const menu = watchMenuEl();
  if (!menu) return;
  const again = !menu.hidden && menu.dataset.for === keyOf(it);
  closeWatchMenu();
  if (again) return;                       // 再点一次收起

  const q = watchQuery(it);
  menu.dataset.for = keyOf(it);

  const head = document.createElement("div");
  head.className = "wm-head";
  head.textContent = "在哪个平台看《" + it.t + "》";
  menu.append(head);

  const plats = enabledPlatforms();
  if (!plats.length) {
    const tip = document.createElement("div");
    tip.className = "wm-empty";
    tip.textContent = "没有勾选平台，去「设置与备份」里选。";
    menu.append(tip);
  }
  plats.forEach((p) => {
    const a = document.createElement("a");
    a.className = "wm-item" + (p.custom ? " custom" : "");
    a.href = p.url(q);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    const dot = document.createElement("i");
    dot.style.background = p.color;
    const nm = document.createElement("span");
    nm.textContent = p.name;
    a.append(dot, nm);

    if (p.custom) {
      // 自定义平台：打开它的首页，同时把片名复制到剪贴板
      const tip = document.createElement("span");
      tip.className = "wm-hint";
      tip.textContent = "复制片名";
      a.append(tip);
      a.onclick = () => {
        copyText(it.t).then((ok) => {
          toast(ok
            ? "已复制「" + it.t + "」，粘贴到搜索框即可"
            : "复制失败，片名：" + it.t);
        });
        closeWatchMenu();
      };
    } else {
      a.onclick = () => closeWatchMenu();
    }
    menu.append(a);
  });

  const r = anchor.getBoundingClientRect();
  menu.hidden = false;
  const w = menu.offsetWidth;
  const h = menu.offsetHeight;
  const sx = window.scrollX || 0;
  const sy = window.scrollY || 0;
  let left = Math.min(r.right - w, window.innerWidth - w - 8);
  left = Math.max(8, left);
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = r.top - h - 6;
  menu.style.left = (left + sx) + "px";
  menu.style.top = (Math.max(8, top) + sy) + "px";
}

document.addEventListener("scroll", closeWatchMenu, true);
window.addEventListener("resize", closeWatchMenu);

function renderAll() {
  renderThemes();
  renderHead();
  buildFilters();
  renderList();
}

  modal.textContent = "";
  const head = document.createElement("div");
  head.className = "modal-head";
  const h2 = document.createElement("h2");
  h2.textContent = title;
  const x = document.createElement("button");

  const body = document.createElement("div");

  modal.append(head, body);
  overlay.hidden = false;

function closeModal() { overlay.hidden = true; }
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (watchMenuEl() && !watchMenuEl().hidden) { closeWatchMenu(); return; }  // 先收观看菜单
    if (openMsKey) { closeMsPanels(); return; }     // 再收筛选下拉，最后关弹窗
    hideSuggest();
    closeModal();
  }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    e.preventDefault(); $("#q").focus();
  }
});

/* ---------- 联网搜索（Wikidata，免密钥） ---------- */
const WD_API = "https://www.wikidata.org/w/api.php";
const WD_SPARQL = "https://query.wikidata.org/sparql";

const FILM_TYPES = {
  Q11424: "电影", Q202866: "动画电影", Q506240: "电视电影",
  Q5398426: "电视剧", Q581714: "动画剧集", Q1259759: "迷你剧"
};
// 命中的条目本身就是「系列」时，直接当作系列片
const SERIES_TYPES = { Q24856: "电影系列" };

function claimIds(claims, prop) {
  return (claims[prop] || [])
    .map((c) => (c.mainsnak && c.mainsnak.datavalue && c.mainsnak.datavalue.value
      ? c.mainsnak.datavalue.value.id : null))
    .filter(Boolean);
}

function pickLabel(ent) {
  const l = ent.labels || {};
  return (l["zh-hans"] && l["zh-hans"].value)
    || (l.zh && l.zh.value)
    || (l.en && l.en.value) || "";
}

function datesOf(claims) {
  const times = (claims.P577 || [])
    .map((c) => (c.mainsnak && c.mainsnak.datavalue && c.mainsnak.datavalue.value
      ? c.mainsnak.datavalue.value.time : null))
    .filter(Boolean)
    .map((t) => t.replace(/^\+/, ""));
  const full = times
    .filter((t) => !t.startsWith("0000") && t.slice(5, 7) !== "00")
    .map((t) => t.slice(0, 10))
    .filter((t) => /^\d{4}-\d{2}-\d{2}$/.test(t))
    .sort();
  if (full.length) return { d: full[0], ds: "" };
  const years = times.map((t) => t.slice(0, 4))
    .filter((y) => /^\d{4}$/.test(y) && y !== "0000").sort();
  return years.length ? { d: years[0] + "-01-01", ds: years[0] + "年" } : { d: "", ds: "" };
}

async function onlineSearch(q) {
  const u1 = WD_API + "?action=wbsearchentities&format=json&origin=*&language=zh&uselang=zh"
    + "&type=item&limit=15&search=" + encodeURIComponent(q);
  const r1 = await fetch(u1);
  if (!r1.ok) throw new Error("HTTP " + r1.status);
  const j1 = await r1.json();
  const hits = (j1.search || []).filter((h) => h.id);
  if (!hits.length) return { films: [], series: [] };

  const desc = {};
  hits.forEach((h) => { desc[h.id] = h.description || ""; });

  const u2 = WD_API + "?action=wbgetentities&format=json&origin=*&props=claims|labels"
    + "&languages=zh-hans|zh|en&ids=" + hits.map((h) => h.id).join("|");
  const r2 = await fetch(u2);
  if (!r2.ok) throw new Error("HTTP " + r2.status);
  const j2 = await r2.json();

  const films = [];
  const hitSeries = new Map();      // 影片反查出来的系列 -> 命中数
  const seriesLabels = new Map();   // 系列 QID -> 名称

  Object.entries(j2.entities || {}).forEach(([qid, ent]) => {
    const claims = ent.claims || {};
    const p31 = claimIds(claims, "P31");
    const label = pickLabel(ent);
    if (!label) return;

    // ① 命中的条目本身就是系列
    if (p31.some((t) => SERIES_TYPES[t])) {
      seriesLabels.set(qid, label);
      return;
    }

    const kind = p31.map((t) => FILM_TYPES[t]).find(Boolean);
    if (!kind) return;

    // ② 反查这部片子属于哪个系列（P179 = part of the series）
    claimIds(claims, "P179").forEach((sid) => {
      hitSeries.set(sid, (hitSeries.get(sid) || 0) + 1);
    });

    const { d, ds } = datesOf(claims);
    let note = (desc[qid] || "").replace(/^\d{4}年(的)?/, "").trim();
    if (note === "電影" || note === "电影" || note.length < 2) note = "";

    films.push({ t: label, d, ds, v: kind, s: "", n: note, qid });
  });

  // 补齐系列名称
  const unknown = [...hitSeries.keys()].filter((id) => !seriesLabels.has(id));
  if (unknown.length) {
    try {
      const u3 = WD_API + "?action=wbgetentities&format=json&origin=*&props=labels"
        + "&languages=zh-hans|zh|en&ids=" + unknown.join("|");
      const r3 = await fetch(u3);
      if (r3.ok) {
        const j3 = await r3.json();
        Object.entries(j3.entities || {}).forEach(([id, ent]) => {
          const lab = pickLabel(ent);
          if (lab) seriesLabels.set(id, lab);
        });
      }
    } catch (e) { /* 拿不到名称就不提示这条系列 */ }
  }

  const series = [...seriesLabels.entries()]
    .map(([qid, label]) => ({ qid, label, hits: hitSeries.get(qid) || 0 }))
    .sort((a, b) => b.hits - a.hits)
    .slice(0, 3);

  const seen = new Set();
  const uniq = films.filter((x) => {
    const k = x.t + "@" + (x.d || "").slice(0, 4);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });

  return { films: uniq, series };
}

/* 取某个系列的全部成员（SPARQL） */
async function seriesMembers(qid) {
  const sparql = "SELECT ?film ?filmLabel (MIN(?d) AS ?date) WHERE {"
    + " ?film wdt:P179 wd:" + qid + " ."
    + " OPTIONAL { ?film wdt:P577 ?d . }"
    + " SERVICE wikibase:label { bd:serviceParam wikibase:language \"zh-hans,zh,en\". }"
    + " } GROUP BY ?film ?filmLabel ORDER BY ?date LIMIT 400";
  const url = WD_SPARQL + "?format=json&query=" + encodeURIComponent(sparql);
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  return (j.results.bindings || [])
    .map((b) => ({
      t: b.filmLabel ? b.filmLabel.value : "",
      d: b.date && b.date.value ? b.date.value.slice(0, 10) : "",
      ds: "", v: "电影", s: "", n: "",
    }))
    .filter((x) => x.t && !/^Q\d+$/.test(x.t));
}

/* 用联网查到的系列建一个片单并切过去 */
async function openSeriesTheme(qid, label, onStatus) {
  const id = "wd" + qid;
  if (onStatus) onStatus("正在获取「" + label + "」的完整片目…");
  const items = await seriesMembers(qid);
  if (!items.length) throw new Error("这个系列没取到片目");

  let th = state.themes.find((t) => t.id === id);
  if (!th) {
    th = { id, name: label };
    state.themes.push(th);
  }
  const bucket = state.extra[id] || [];
  const seen = new Set(bucket.map(keyOf));
  let added = 0;
  items.forEach((it) => {
    if (!seen.has(keyOf(it))) { bucket.push(it); seen.add(keyOf(it)); added++; }
  });
  state.extra[id] = bucket;
  state.cur = id;
  save();
  renderAll();
  closeModal();
  return { added, total: items.length };
}

/* ---------- 重命名片单 ---------- */
function openRename(themeId) {
  const cur = themeName(themeId);
  openModal("重命名片单", (body) => {
    const f = document.createElement("div");
    f.className = "field";
    const label = document.createElement("label");
    label.textContent = "名称";
    const input = document.createElement("input");
    input.value = cur;
    input.maxLength = 40;
    f.append(label, input);

    const bar = document.createElement("div");
    bar.className = "row-actions";
    const ok = document.createElement("button");
    ok.className = "btn primary";
    ok.textContent = "保存";
    const cancel = document.createElement("button");
    cancel.className = "btn";
    cancel.textContent = "取消";
    cancel.onclick = closeModal;
    bar.append(ok, cancel);

    const apply = () => {
      const name = input.value.trim();
      if (!name) return;
      const th = state.themes.find((t) => t.id === themeId);
      if (th) th.name = name;
      save(); renderAll(); closeModal();
    };
    ok.onclick = apply;
    input.onkeydown = (e) => { if (e.key === "Enter") apply(); };

    body.append(f, bar);
    input.focus(); input.select();
  });
}

/* ---------- 添加片单 / 搜索添加 ---------- */
function openAdd() {
  openModal("新建片单", (body) => {
    /* ---- ① 自定义片单 ---- */
    const nameField = document.createElement("div");
    nameField.className = "field";
    const nameLabel = document.createElement("label");
    nameLabel.textContent = "自定义片单";
    const nameRow = document.createElement("div");
    nameRow.className = "name-row";
    const nameInput = document.createElement("input");
    nameInput.placeholder = "起个名字，例如：诺兰作品集、2026 待看";
    nameInput.maxLength = 40;
    nameInput.autocomplete = "off";
    const nameBtn = document.createElement("button");
    nameBtn.className = "btn primary";
    nameBtn.textContent = "创建";
    nameRow.append(nameInput, nameBtn);
    nameField.append(nameLabel, nameRow);

    const createBlank = () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      const id = "u" + Date.now().toString(36);
      state.themes.push({ id, name });
      state.cur = id;
      save(); renderAll(); closeModal();
    };
    nameBtn.onclick = createBlank;
    nameInput.onkeydown = (e) => { if (e.key === "Enter") createBlank(); };

    /* ---- ② 或者从片库 / 联网添加 ---- */
    const divider = document.createElement("div");
    divider.className = "divider";
    divider.textContent = "或从下面添加";

    const modeBar = document.createElement("div");
    modeBar.className = "chips";
    modeBar.style.marginBottom = "12px";
    const bLib = document.createElement("button");
    bLib.className = "on";
    bLib.textContent = "本地片库";
    const bNet = document.createElement("button");
    bNet.textContent = "联网搜索";
    modeBar.append(bLib, bNet);

    const f = document.createElement("div");
    f.className = "field";
    const label = document.createElement("label");
    label.textContent = "搜索片库";
    const input = document.createElement("input");
    input.placeholder = "输入系列名或片名，例如：007、星球大战、蜘蛛侠";
    input.autocomplete = "off";
    f.append(label, input);

    const res = document.createElement("div");
    res.className = "result";

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "系列片会作为一个新片单加入左侧；单片会直接加进当前片单「" + themeName(state.cur) + "」。";

    body.append(nameField, divider, modeBar, f, res, hint);

    let mode = "lib";

    const drawLib = () => {
      const q = input.value.trim().toLowerCase();
      res.textContent = "";

      const seriesHits = Object.entries(CATALOG)
        .filter(([id, s]) => !q || s.name.toLowerCase().includes(q)
          || s.items.some((i) => i.t.toLowerCase().includes(q)));

      const h1 = document.createElement("h4");
      h1.textContent = "系列片（" + seriesHits.length + "）";
      res.append(h1);

      seriesHits.forEach(([id, s]) => {
        const added = state.themes.some((t) => t.id === id);
        const row = document.createElement("div");
        row.className = "hit";
        const hi = document.createElement("div");
        hi.className = "hi";
        const ht = document.createElement("div");
        ht.className = "ht";
        ht.textContent = s.name;
        const hs = document.createElement("div");
        hs.className = "hs";
        hs.textContent = s.items.length + " 部";
        hi.append(ht, hs);
        const btn = document.createElement("button");
        btn.className = "btn" + (added ? "" : " primary");
        btn.textContent = added ? "已添加" : "添加";
        btn.disabled = added;
        btn.onclick = () => {
          state.themes.push({ id });
          state.cur = id;
          save(); renderAll(); drawLib();
        };
        row.append(hi, btn);
        res.append(row);
      });

      const filmHits = [];
      Object.entries(CATALOG).forEach(([id, s]) => {
        s.items.forEach((it) => {
          if (!q || it.t.toLowerCase().includes(q)) filmHits.push({ id, s, it });
        });
      });

      const h2 = document.createElement("h4");
      h2.textContent = "单片（" + filmHits.length + "，加入当前片单：" + themeName(state.cur) + "）";
      res.append(h2);

      filmHits.slice(0, 60).forEach(({ s, it }) => {
        res.append(hitRow(it.t, s.name + " · " + fmt(it), it));
      });

      if (!filmHits.length) {
        const p = document.createElement("div");
        p.className = "hint";
        p.textContent = "片库里没有匹配的单片，切到「联网搜索」试试。";
        res.append(p);
      }
    };

    function hitRow(title, sub, item) {
      const row = document.createElement("div");
      row.className = "hit";
      const hi = document.createElement("div");
      hi.className = "hi";
      const ht = document.createElement("div");
      ht.className = "ht";
      ht.textContent = title;
      const hs = document.createElement("div");
      hs.className = "hs";
      hs.textContent = sub;
      hi.append(ht, hs);
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = "加入";
      btn.onclick = () => {
        addItemTo(state.cur, item);
        btn.textContent = "已加入";
        btn.disabled = true;
      };
      row.append(hi, btn);
      return row;
    }

    let netSeq = 0;
    const drawNet = async () => {
      const q = input.value.trim();
      res.textContent = "";
      if (q.length < 2) {
        const p = document.createElement("div");
        p.className = "hint";
        p.textContent = "输入至少 2 个字，从 Wikidata 联网检索电影/剧集。";
        res.append(p);
        return;
      }
      const seq = ++netSeq;
      const loading = document.createElement("div");
      loading.className = "hint";
      loading.textContent = "联网检索中…";
      res.append(loading);

      try {
        const { films, series } = await onlineSearch(q);
        if (seq !== netSeq) return;
        res.textContent = "";

        /* ① 识别到的系列片：可直接建片单并切过去 */
        if (series.length) {
          const hs = document.createElement("h4");
          hs.textContent = "识别到系列片";
          res.append(hs);

          series.forEach((s) => {
            const row = document.createElement("div");
            row.className = "hit";
            const hi = document.createElement("div");
            hi.className = "hi";
            const ht = document.createElement("div");
            ht.className = "ht";
            ht.textContent = s.label;
            const sub = document.createElement("div");
            sub.className = "hs";
            sub.textContent = s.hits
              ? "命中 " + s.hits + " 部 · 点右侧取完整片目"
              : "电影系列 · 点右侧取完整片目";
            hi.append(ht, sub);

            const btn = document.createElement("button");
            btn.className = "btn primary";
            const exists = state.themes.some((t) => t.id === "wd" + s.qid);
            btn.textContent = exists ? "切换" : "新建片单";
            btn.onclick = async () => {
              btn.disabled = true;
              const old = btn.textContent;
              btn.textContent = "获取中…";
              try {
                const r = await openSeriesTheme(s.qid, s.label);
                void r;
              } catch (err) {
                btn.disabled = false;
                btn.textContent = old;
                sub.textContent = "获取失败：" + err.message;
              }
            };
            row.append(hi, btn);
            res.append(row);
          });
        }

        /* ② 单片结果 */
        const h = document.createElement("h4");
        h.textContent = films.length
          ? "单片（" + films.length + "，加入当前片单：" + themeName(state.cur) + "）"
          : "单片";
        res.append(h);

        if (!films.length) {
          const p = document.createElement("div");
          p.className = "hint";
          p.textContent = series.length
            ? "没有匹配的单片，可以点上面的系列片新建片单。"
            : "没有找到匹配的电影/剧集，换个关键词试试。";
          res.append(p);
          return;
        }

        films.forEach((it) => {
          const sub = [it.v, it.ds || (it.d ? it.d.slice(0, 4) + "年" : "年份未知"), it.n]
            .filter(Boolean).join(" · ");
          res.append(hitRow(it.t, sub, it));
        });
      } catch (err) {
        if (seq !== netSeq) return;
        res.textContent = "";
        const p = document.createElement("div");
        p.className = "hint";
        p.textContent = "联网搜索失败：" + err.message + "。检查网络后重试。";
        res.append(p);
      }
    };

    const redraw = () => (mode === "lib" ? drawLib() : drawNet());

    bLib.onclick = () => {
      mode = "lib";
      bLib.classList.add("on"); bNet.classList.remove("on");
      label.textContent = "搜索片库";
      input.placeholder = "输入系列名或片名，例如：007、星球大战、蜘蛛侠";
      redraw();
    };
    bNet.onclick = () => {
      mode = "net";
      bNet.classList.add("on"); bLib.classList.remove("on");
      label.textContent = "联网搜索（Wikidata，免密钥）";
      input.placeholder = "输入片名，例如：沙丘、奥本海默";
      redraw();
    };

    let timer = null;
    input.oninput = () => {
      clearTimeout(timer);
      if (mode === "lib") return drawLib();
      timer = setTimeout(drawNet, 400);
    };

    drawLib();
    input.focus();
  });
}

function addItemTo(themeId, it) {
  if (!state.extra[themeId]) state.extra[themeId] = [];
  const exists = itemsOf(themeId).some((x) => keyOf(x) === keyOf(it));
  if (!exists) {
    state.extra[themeId].push({ t: it.t, d: it.d || "", ds: it.ds || "", v: it.v || "", s: it.s || "", n: it.n || "" });
    save(); renderAll();
  }
}

/* ---------- 更新 ---------- */
function openUpdate() {
  openModal("更新片单", (body) => {
    const note = document.createElement("div");
    note.className = "hint";
    note.textContent =
      "三种方式，任选其一：\n" +
      "① 在线同步：用 TMDB 按系列名拉取该系列全部影片，自动补上片库里没有的新片（需要免费 API Key）。\n" +
      "② 导入文件：选择别人给你的更新包 .json。\n" +
      "③ 粘贴 JSON：直接贴一段数据。";
    body.append(note);

    const fk = document.createElement("div");
    fk.className = "field";
    fk.style.marginTop = "14px";
    const lk = document.createElement("label");
    lk.textContent = "TMDB API Key（可留空，仅在线同步需要）";
    const ik = document.createElement("input");
    ik.value = apiKey("tmdb");
    ik.placeholder = "在 themoviedb.org 免费申请";
    ik.oninput = () => { state.settings.apiKeys.tmdb = ik.value.trim(); save(); };
    fk.append(lk, ik);

    const fc = document.createElement("div");
    fc.className = "field";
    const lc = document.createElement("label");
    lc.textContent = "TMDB 系列 ID（可留空，留空则按片单名称搜索）";
    const ic = document.createElement("input");
    ic.placeholder = "例如 漫威合集 ID；留空自动搜索";
    fc.append(lc, ic);
    body.append(fk, fc);

    const bar = document.createElement("div");
    bar.className = "row-actions";
    const bSync = document.createElement("button");
    bSync.className = "btn primary";
    bSync.textContent = "在线同步当前片单";
    const bFile = document.createElement("button");
    bFile.className = "btn";
    bFile.textContent = "导入 .json 文件";
    const bPaste = document.createElement("button");
    bPaste.className = "btn";
    bPaste.textContent = "粘贴 JSON";
    bar.append(bSync, bFile, bPaste);
    body.append(bar);

    const log = document.createElement("div");
    log.className = "log";
    body.append(log);

    const say = (t) => { log.textContent = t; };

    bSync.onclick = async () => {
      const key = apiKey("tmdb");
      if (!key) { say("请先填 TMDB API Key。没有 Key 的话，可以用 ② 或 ③ 导入。"); return; }
      const idRaw = ic.value.trim();
      bSync.disabled = true;
      try {
        say("正在同步…");
        let collectionId = idRaw;
        if (!collectionId) {
          const q = encodeURIComponent(themeName(state.cur));
          const r = await fetch("https://api.themoviedb.org/3/search/collection?language=zh-CN&query=" + q + "&api_key=" + key);
          if (!r.ok) throw new Error("搜索系列失败 HTTP " + r.status);
          const j = await r.json();
          if (!j.results || !j.results.length) throw new Error("没找到同名系列，请在下方填 TMDB 系列 ID");
          collectionId = j.results[0].id;
          say("匹配到系列：" + j.results[0].name + "（ID " + collectionId + "），正在拉取…");
        }
        const r2 = await fetch("https://api.themoviedb.org/3/collection/" + collectionId + "?language=zh-CN&api_key=" + key);
        if (!r2.ok) throw new Error("拉取系列失败 HTTP " + r2.status);
        const c = await r2.json();
        const parts = c.parts || [];
        const have = new Set(itemsOf(state.cur).map((x) => x.t));
        let added = 0, updated = 0;

        parts.forEach((p) => {
          const t = p.title || p.name;
          if (!t) return;
          const d = p.release_date || "";
          const existing = itemsOf(state.cur).find((x) => x.t === t);
          if (existing) {
            if (d && existing.d !== d) { existing.d = d; existing.ds = ""; updated++; }
            return;
          }
          addItemTo(state.cur, {
            t, d, ds: "", v: "电影", s: "TMDB",
            n: p.original_title && p.original_title !== t ? p.original_title : ""
          });
          have.add(t); added++;
        });
        save(); renderAll();
        say("同步完成：" + (c.name || "") + " 共 " + parts.length + " 部。\n新增 " + added + " 部，更新日期 " + updated + " 部。");
      } catch (err) {
        say("同步失败：" + err.message + "\n可改用导入文件或粘贴 JSON。");
      } finally {
        bSync.disabled = false;
      }
    };

    bFile.onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = ".json,application/json";
      inp.onchange = () => {
        const file = inp.files[0];
        if (!file) return;
        const rd = new FileReader();
        rd.onload = () => { say(applyPayload(rd.result)); };
        rd.readAsText(file, "utf-8");
      };
      inp.click();
    };

    bPaste.onclick = () => {
      const ta = document.createElement("textarea");
      ta.value = '[{"t":"片名","d":"2027-01-01","v":"电影","s":"MCU","n":"备注"}]';
      ta.placeholder = '[{"t":"新片名","d":"2027-01-01","v":"电影","s":"MCU","n":"备注"}]';
      const ok = document.createElement("button");
      ok.className = "btn primary";
      ok.textContent = "应用到当前片单";
      ok.onclick = () => { say(applyPayload(ta.value)); ta.remove(); ok.remove(); };
      body.append(ta, ok);
      ta.focus(); ta.select();
    };
  });
}

function applyPayload(text) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { return "JSON 格式有误：" + e.message; }

  let items = [];
  if (Array.isArray(data)) items = data;
  else if (data && Array.isArray(data.items)) items = data.items;
  else return "没找到 items 数组。格式应为 [...] 或 {name, items:[...]}。";

  let added = 0;
  items.forEach((raw) => {
    if (!raw || !raw.t) return;
    const it = { t: raw.t, d: raw.d || "", ds: raw.ds || "", v: raw.v || "电影", s: raw.s || "", n: raw.n || "" };
    if (!itemsOf(state.cur).some((x) => keyOf(x) === keyOf(it))) { addItemTo(state.cur, it); added++; }
  });
  save(); renderAll();
  return "导入完成：新增 " + added + " 条到「" + themeName(state.cur) + "」。";
}

      allPlatforms().forEach((p) => {
        const opt = document.createElement("label");
        opt.className = "plat-opt";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = curIds.indexOf(p.id) >= 0;
        cb.onchange = () => {
          const ids = (state.settings.platforms || PLATFORM_DEFAULT).slice();
          const at = ids.indexOf(p.id);
          if (cb.checked && at < 0) ids.push(p.id);
          if (!cb.checked && at >= 0) ids.splice(at, 1);
          state.settings.platforms = allPlatforms().map((x) => x.id).filter((id) => ids.indexOf(id) >= 0);
          save();
          renderList();
        };
        const dot = document.createElement("i");
        dot.style.background = p.color;
        const nm = document.createElement("span");
        nm.textContent = p.name;
        opt.append(cb, dot, nm);

        if (p.custom) {
          const ed = document.createElement("button");
          ed.className = "plat-edit";
          ed.textContent = "✎";
          ed.title = "编辑这个平台";
          ed.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const raw = customPlatforms().find((c) => c.id === p.id);
            if (raw) startEdit(raw);   // 用原始记录，那里的 url 是字符串
          };
          opt.append(ed);

          const del = document.createElement("button");
          del.className = "plat-del";
          del.textContent = "×";
          del.title = "删除这个平台";
          del.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!confirm("删除自定义平台「" + p.name + "」？")) return;
            state.settings.customPlatforms = customPlatforms().filter((c) => c.id !== p.id);
            state.settings.platforms = (state.settings.platforms || PLATFORM_DEFAULT).filter((id) => id !== p.id);
            save(); renderPicker(); renderList();
          };
          opt.append(del);
        }
        picker.append(opt);
      });
    };
    renderPicker();

    /* 新增 / 编辑自定义平台 */
    const addRow = document.createElement("div");
    addRow.className = "plat-add";
    const nameIn = document.createElement("input");
    nameIn.type = "text";
    nameIn.placeholder = "平台名称，例如 抖音";
    const urlIn = document.createElement("input");
    urlIn.type = "text";
    urlIn.placeholder = "平台首页地址，例如 https://www.douyin.com";
    const addBtn = document.createElement("button");
    addBtn.className = "btn";
    addBtn.textContent = "添加";
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "btn";
    cancelBtn.textContent = "取消";
    cancelBtn.style.display = "none";
    const err = document.createElement("div");
    err.className = "plat-err";

    const resetForm = () => {
      editingId = null;
      nameIn.value = "";
      urlIn.value = "";
      addBtn.textContent = "添加";
      cancelBtn.style.display = "none";
      err.classList.remove("bad");
      err.textContent = "";
    };

    const startEdit = (p) => {
      editingId = p.id;
      nameIn.value = p.name;
      urlIn.value = p.url;
      addBtn.textContent = "保存";
      cancelBtn.style.display = "";
      err.classList.remove("bad");
      err.textContent = "正在编辑「" + p.name + "」";
      nameIn.focus();
      nameIn.select();
    };

    const submit = () => {
      const name = nameIn.value.trim();
      const url = urlIn.value.trim();
      const fail = (msg, el) => {
        err.textContent = msg;
        err.classList.add("bad");
        if (el) el.focus();
      };
      if (!name) return fail("请填平台名称。", nameIn);
      if (!url) return fail("请填搜索地址。", urlIn);
      if (!/^https?:\/\/[^\s]+$/i.test(url)) {
        return fail("地址必须以 http:// 或 https:// 开头。", urlIn);
      }

      if (editingId) {
        state.settings.customPlatforms = customPlatforms().map((c) =>
          (c.id === editingId ? { id: c.id, name: name, url: url } : c));
        save();
        renderPicker();
        renderList();
        resetForm();
        err.textContent = "已保存「" + name + "」。";
        return;
      }

      const id = "cp" + Date.now().toString(36);
      state.settings.customPlatforms = customPlatforms().concat([{ id: id, name: name, url: url }]);
      state.settings.platforms = (state.settings.platforms || PLATFORM_DEFAULT).concat([id]);
      save();
      renderPicker();
      renderList();
      resetForm();
      err.textContent = "已添加「" + name + "」。";
    };

    addBtn.onclick = submit;
    cancelBtn.onclick = () => { resetForm(); renderPicker(); };
    nameIn.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
    urlIn.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } };

    addRow.append(nameIn, urlIn, addBtn, cancelBtn);
    const addHint = document.createElement("div");
    addHint.className = "hint";
    addHint.textContent = "自定义平台点击后直接打开该平台首页，同时把片名复制到剪贴板，粘贴到站内搜索框即可。（内置的 5 个平台仍是直接搜片名。）";
    fp.append(lp, picker, addRow, err, addHint);

    body.append(f1, fk, fr, f2, fp);

    const h = document.createElement("div");
    h.className = "hint";
    h.textContent =
      (storageMode === "disk"
        ? "数据保存在 data\\state.json：改动后自动写回，上一版留作 state.bak.json。\n"
        : "当前没连上本地服务，数据暂存在浏览器里；用「启动片单.bat」打开即可存到 data\\。\n") +
      "换电脑前记得导出备份。\n" +
      "快捷键：/ 聚焦搜索，Esc 关闭弹窗。";
    body.append(h);
  });
}

/* ============================================================ init */
function applyTheme() {
  document.documentElement.dataset.theme = state.settings.dark ? "dark" : "light";
}

function updateStorageBadge() {
  const el = $("#storageInfo");
  if (el) {
    el.textContent = "";
    if (storageMode === "disk") {
      el.append("数据：");
      const b = document.createElement("b");
      b.textContent = "data/state.json";
      el.append(b);
    } else {
      el.textContent = "数据：浏览器本地（用「启动片单.bat」打开可存到 data/）";
    }
  }
  const banner = $("#offlineBanner");
  if (banner) banner.hidden = storageMode === "disk";
}

/* 服务没起来时每隔一会儿探一次，恢复后自动切回写盘，避免一直悄悄存浏览器 */
let recheckTimer = null;
function startRecheck() {
  if (recheckTimer) return;
  recheckTimer = setInterval(async () => {
    if (storageMode === "disk") { clearInterval(recheckTimer); recheckTimer = null; return; }
    try {
      const r = await fetch(API + "/api/health", { cache: "no-store" });
      if (!r.ok) return;
      storageMode = "disk";
      updateStorageBadge();
      await saveState(true);   // 把浏览器里的当前状态补写进 data/
      clearInterval(recheckTimer);
      recheckTimer = null;
    } catch (e) { /* 还没起来，下次再试 */ }
  }, 15000);
}

$("#btnAddTheme").onclick = openAdd;
$("#btnUpdate").onclick = openUpdate;
$("#btnSettings").onclick = openSettings;
$("#q").oninput = () => { renderList(); renderSuggest(); };
$("#q").onkeydown = (e) => {
  const open = !$("#suggest").hidden;
  if (!open) { if (e.key === "Escape") hideSuggest(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); moveSug(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSug(-1); }
  else if (e.key === "Enter" && sugIndex >= 0) {
    e.preventDefault();
    switchSeries(sugList[sugIndex].id);
  } else if (e.key === "Escape") {
    hideSuggest();
  }
};
$("#sort").onchange = () => { renderList(); save(); };
$("#chips").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  document.querySelectorAll("#chips button").forEach((x) => x.classList.toggle("on", x === b));
  renderList();
  save();
};

window.__readyPromise = (async function init() {
  await bootState();
  applyTheme();
  applyUiState();      // 还原上次的筛选 / 排序 / 已看筛选
  renderAll();
  updateStorageBadge();
  if (storageMode !== "disk") startRecheck();
})();
</script>
